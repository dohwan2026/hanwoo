name: 한우 시세 받기

on:
  schedule:
    - cron: '0 10 * * 1-6'   # 월~토 19:00 (한국 시각)
  workflow_dispatch:
    inputs:
      probe:
        description: '응답 구조만 살펴보기 (파일 안 바꿈)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 시세 받기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/fetch_prices.py ${{ inputs.probe && '--probe' || '' }}
      - name: 바뀐 시세 저장
        if: ${{ !inputs.probe }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prices.json
          git diff --cached --quiet || (git commit -m '시세 갱신' && git push)
