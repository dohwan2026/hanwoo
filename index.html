<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한우 수첩</title>
<meta name="description" content="한우 개체·번식·접종·체중·출하·장부·더위 경보를 한 곳에서 관리하는 농장 수첩">
<meta name="theme-color" content="#1f7a3d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #f5f6f2; --card: #ffffff; --text: #1b1f1a; --muted: #66705f; --line: #e1e5dc;
  --accent: #1f7a3d; --accent-text: #ffffff; --chip: #edf1e8; --danger: #d23b30; --ok: #1f8a4c;
  --warn: #c77700; --warn-bg: #fff3d6; --warn-text: #6b4e00; --pink: #c2417a; --blue: #2563eb;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101310; --card: #191d18; --text: #e7ebe4; --muted: #9ba596; --line: #2b3229;
    --accent: #3fae62; --chip: #232922; --danger: #ff6a5f; --ok: #3fc07a;
    --warn: #ffb547; --warn-bg: #3a3014; --warn-text: #ffd978; --pink: #ff7fb2; --blue: #6b9bff;
  }
}
:root[data-theme="dark"] {
  --bg: #101310; --card: #191d18; --text: #e7ebe4; --muted: #9ba596; --line: #2b3229;
  --accent: #3fae62; --chip: #232922; --danger: #ff6a5f; --ok: #3fc07a;
  --warn: #ffb547; --warn-bg: #3a3014; --warn-text: #ffd978; --pink: #ff7fb2; --blue: #6b9bff;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  font-size: 17px; line-height: 1.5; -webkit-tap-highlight-color: transparent;
}
main { max-width: 600px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom)); }
h1 { font-size: 1.45rem; margin: 4px 0 2px; }
h2 { font-size: 1.1rem; margin: 0 0 12px; }
h3 { font-size: 1rem; margin: 16px 0 8px; color: var(--muted); }
.sub { color: var(--muted); font-size: .92rem; margin: 0 0 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
.muted { color: var(--muted); font-size: .9rem; }
.small { font-size: .85rem; }
.hidden { display: none !important; }
button, input, textarea, select { font: inherit; color: inherit; }
.btn {
  border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-text);
  min-height: 52px; padding: 10px 16px; font-weight: 700; cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-align: center;
}
.btn:disabled { opacity: .5; }
.btn.ghost { background: var(--chip); color: var(--text); }
.btn.danger { background: var(--danger); color: #fff; }
.btn.block { width: 100%; }
.btn.sm { min-height: 40px; padding: 6px 12px; font-size: .92rem; }
.row { display: flex; gap: 8px; align-items: center; }
.row > .grow { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip {
  min-height: 42px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip);
  font-weight: 600; cursor: pointer; padding: 6px 14px;
}
.chip.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
label.field { display: block; margin-top: 12px; }
label.field > span { display: block; font-size: .9rem; color: var(--muted); margin-bottom: 6px; }
input[type=text], input[type=number], input[type=date], input[type=search], select, textarea {
  width: 100%; min-height: 52px; padding: 10px 12px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--bg); font-size: 17px;
}
textarea { min-height: 76px; resize: vertical; }
label.check { display: flex; gap: 10px; align-items: center; margin-top: 14px; min-height: 44px; }
label.check input { width: 24px; height: 24px; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
.kv:first-child { border-top: 0; }
.kv b { text-align: right; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
.stats div { background: var(--chip); border-radius: 12px; padding: 10px 4px; }
.stats b { display: block; font-size: 1.45rem; line-height: 1.2; }
.stats span { font-size: .8rem; color: var(--muted); }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); cursor: pointer; }
.list li:first-child { border-top: 0; }
.list .num { flex: none; min-width: 72px; height: 52px; border-radius: 12px; background: var(--chip); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.3rem; letter-spacing: .5px; padding: 0 8px; }
.list .num.f { background: #fde3ee; color: #9b2457; }
.list .num.m { background: #dfe9ff; color: #1f47a8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .list .num.f { background: #3d2230; color: #ffb3d1; } :root:not([data-theme="light"]) .list .num.m { background: #1f2a45; color: #b6ccff; } }
.list li.grp { display: block; cursor: default; }
.list li.grp summary { display: flex; gap: 12px; align-items: center; cursor: pointer; list-style: none; }
.list li.grp summary::-webkit-details-marker { display: none; }
.list li.grp details[open] summary .muted.small:first-of-type { visibility: hidden; }
.list .info { flex: 1; min-width: 0; }
.list .info div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .right { flex: none; text-align: right; font-size: .88rem; }
.badge { display: inline-block; font-size: .78rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--text); margin-left: 4px; vertical-align: 1px; }
.badge.g { background: var(--accent); color: var(--accent-text); }
.badge.r { background: var(--danger); color: #fff; }
.badge.y { background: var(--warn-bg); color: var(--warn-text); }
.badge.p { background: var(--pink); color: #fff; }
.over { color: var(--danger); font-weight: 700; }
.soon { color: var(--warn); font-weight: 700; }
.msg { margin: 0 0 14px; padding: 12px 14px; border-radius: 12px; background: var(--warn-bg); color: var(--warn-text); font-size: .93rem; }
.msg.err { background: var(--danger); color: #fff; }
.heat { border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; font-weight: 700; color: #fff; cursor: pointer; }
.lv0 { background: #1f8a4c; } .lv1 { background: #c99a00; } .lv2 { background: #e06c00; } .lv3 { background: #d23b30; } .lv4 { background: #7b1fa2; }
.photo { display: block; width: 100%; max-height: 300px; object-fit: cover; border-radius: 12px; background: var(--chip); margin-bottom: 12px; }
.acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.acts .btn { min-height: 60px; flex-direction: column; gap: 0; font-size: .92rem; }
.acts .btn i { font-style: normal; font-size: 1.35rem; line-height: 1.2; }
.big-tag { font-size: 2.3rem; font-weight: 800; letter-spacing: 1px; line-height: 1.1; }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { padding: 10px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; }
.tl li:first-child { border-top: 0; }
.tl .d { flex: none; width: 86px; color: var(--muted); font-size: .9rem; }
.tl .x { flex: none; border: 0; background: none; color: var(--muted); font-size: 1.2rem; cursor: pointer; min-width: 40px; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: env(safe-area-inset-bottom); z-index: 10;
}
.tabbar a { text-decoration: none; color: var(--muted); text-align: center; padding: 8px 0 10px; font-size: .82rem; font-weight: 700; }
.tabbar a i { display: block; font-style: normal; font-size: 1.45rem; line-height: 1.3; }
.tabbar a.on { color: var(--accent); }
.fab { position: fixed; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom)); width: 62px; height: 62px; border-radius: 50%; font-size: 2rem; box-shadow: 0 6px 18px rgba(0,0,0,.25); z-index: 9; }
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--card); width: 100%; max-width: 600px; max-height: 92vh; overflow: auto; border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
.sheet .foot { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; margin-top: 18px; position: sticky; bottom: 0; background: var(--card); padding-top: 8px; }
.toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #222; color: #fff; padding: 12px 18px; border-radius: 12px; z-index: 30; font-weight: 600; max-width: 90vw; }
.bar { height: 10px; border-radius: 6px; background: var(--chip); overflow: hidden; margin-top: 4px; }
.bar > div { height: 100%; background: var(--accent); }
.monthnav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.monthnav b { font-size: 1.2rem; }
.money-in { color: var(--blue); font-weight: 700; }
.money-out { color: var(--danger); font-weight: 700; }
.pick { max-height: 46vh; overflow: auto; border: 1px solid var(--line); border-radius: 12px; padding: 0 10px; }
.pick label { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.pick label:first-child { border-top: 0; }
.pick input { width: 24px; height: 24px; flex: none; }
.hours { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
.hours div { flex: none; width: 54px; text-align: center; border-radius: 10px; padding: 6px 0; color: #fff; font-size: .8rem; font-weight: 700; }
.hours b { display: block; font-size: 1rem; }
a { color: var(--accent); }
.note { color: var(--muted); font-size: .82rem; margin-top: 20px; }
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabbar" id="tabbar">
  <a href="#/" data-tab="home"><i>🏠</i>홈</a>
  <a href="#/cows" data-tab="cows"><i>🐂</i>소 목록</a>
  <a href="#/ledger" data-tab="ledger"><i>💰</i>장부</a>
  <a href="#/tools" data-tab="tools"><i>🧰</i>도구</a>
</nav>
<script>
'use strict';
/* ================= 기본 도우미 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const won = n => (Math.round(+n || 0)).toLocaleString('ko-KR') + '원';
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const addMonths = (s, n) => {
  const d = parse(s), day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n);
  d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); return ymd(d);
};
const diff = (a, b) => Math.round((parse(b) - parse(a)) / 86400000); // b - a (일)
const ageMonths = (birth, at = today()) => {
  if (!birth) return null;
  const a = parse(birth), b = parse(at);
  let m = (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth();
  if (b.getDate() < a.getDate()) m--; return m;
};
const fmtD = s => { if (!s) return ''; const y = s.slice(0, 4); const md = `${+s.slice(5, 7)}/${+s.slice(8)}`; return y === today().slice(0, 4) ? md : `${y.slice(2)}.${md.replace('/', '.')}`; };
const rel = s => { const n = diff(today(), s); return n === 0 ? '오늘' : n === 1 ? '내일' : n === -1 ? '어제' : n > 0 ? `${n}일 뒤` : `${-n}일 지남`; };
const short = tag => { const t = String(tag || '').replace(/\D/g, ''); return t.length > 4 ? t.slice(-4) : (tag || '?'); };
const fmtTag = tag => { const t = String(tag || '').replace(/\D/g, ''); return t.length === 12 ? `${t.slice(0, 3)} ${t.slice(3, 7)} ${t.slice(7, 11)} ${t.slice(11)}` : (tag || ''); };
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }

/* ================= 저장소 (IndexedDB) ================= */
const STORES = ['cows', 'events', 'ledger', 'photos', 'kv'];
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('hanwoo', 1);
      r.onupgradeneeded = () => { for (const s of STORES) if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s, { keyPath: s === 'kv' ? 'k' : 'id' }); };
      r.onsuccess = () => { DB.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = DB.db.transaction(store, mode); const out = fn(t.objectStore(store));
      t.oncomplete = () => res(out && 'result' in out ? out.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  all: s => DB.tx(s, 'readonly', st => st.getAll()),
  get: (s, id) => DB.tx(s, 'readonly', st => st.get(id)),
  put: (s, o) => DB.tx(s, 'readwrite', st => st.put(o)),
  putMany: (s, arr) => DB.tx(s, 'readwrite', st => { for (const o of arr) st.put(o); }),
  del: (s, id) => DB.tx(s, 'readwrite', st => st.delete(id)),
  delMany: (s, ids) => DB.tx(s, 'readwrite', st => { for (const id of ids) st.delete(id); }),
  clear: s => DB.tx(s, 'readwrite', st => st.clear()),
};

const DEFAULTS = { gest: 285, cycle: 21, checkDays: 60, postCalving: 60, shipMonths: 30, wFactor: 1, lat: null, lon: null, place: '', lastBackup: null, farm: '' };
const S = { cows: [], events: [], ledger: [], kv: { ...DEFAULTS }, heat: null };
async function loadAll() {
  [S.cows, S.events, S.ledger] = await Promise.all([DB.all('cows'), DB.all('events'), DB.all('ledger')]);
  const kv = await DB.all('kv'); for (const { k, v } of kv) S.kv[k] = v;
  S.heat = S.kv.heatCache || null;
}
async function setKV(k, v) { S.kv[k] = v; await DB.put('kv', { k, v }); }
const cowById = id => S.cows.find(c => c.id === id);
const eventsOf = id => S.events.filter(e => e.cowId === id).sort((a, b) => a.date.localeCompare(b.date) || (a.t || 0) - (b.t || 0));
const active = () => S.cows.filter(c => (c.status || '사육') === '사육');

/* ================= 1. 개체 관리 ================= */
const GROUPS = ['번식우', '후보우', '비육우', '송아지'];
const SEXES = ['암', '수', '거세'];
const STATUSES = ['사육', '출하', '판매', '폐사'];
const EV = { '발정': '💗', '수정': '🧪', '임신감정': '🩺', '분만': '🐣', '접종': '💉', '구충': '💊', '치료': '🩹', '체중': '⚖️', '출하': '🚚', '메모': '📝' };
const sexCls = c => c.sex === '암' ? 'f' : 'm';
const isBreeder = c => c.sex === '암' && c.group !== '비육우' && c.group !== '송아지';

function cowLine(c) {
  const age = ageMonths(c.birth);
  const b = breeding(c);
  const bits = [c.sex, age != null ? `${age}개월` : '', c.pen ? `${c.pen}` : ''].filter(Boolean).join(' · ');
  return `<li data-go="#/cow/${c.id}"><div class="num ${sexCls(c)}">${esc(short(c.tag))}</div>
    <div class="info"><div><b>${esc(c.name || c.group || '')}</b> ${c.name ? `<span class="badge">${esc(c.group)}</span>` : ''}${c.status && c.status !== '사육' ? `<span class="badge r">${esc(c.status)}</span>` : ''}</div>
    <div class="muted small">${esc(bits)}</div></div>
    ${b ? `<div class="right"><span class="badge ${b.cls}">${esc(b.label)}</span></div>` : ''}</li>`;
}

const cowFilter = { q: '', group: '전체', status: '사육', pen: '' };
function filteredCows() {
  const f = cowFilter, q = f.q.trim();
  return S.cows.filter(c => {
    const st = c.status || '사육';
    if (f.status === '사육' && st !== '사육') return false;
    if (f.status === '나감' && st === '사육') return false;
    if (f.group !== '전체' && c.group !== f.group) return false;
    if (f.pen && c.pen !== f.pen) return false;
    if (q && !(String(c.tag).replace(/\D/g, '').includes(q.replace(/\D/g, '') || '@@') || (c.name || '').includes(q) || (c.memo || '').includes(q))) return false;
    return true;
  }).sort((a, b) => (a.pen || '').localeCompare(b.pen || '', 'ko', { numeric: true }) || short(a.tag).localeCompare(short(b.tag)));
}
const cowListHtml = list => list.length ? `<ul class="list">${list.map(cowLine).join('')}</ul>` : '<p class="muted">해당하는 소가 없습니다.</p>';
function viewCows() {
  const f = cowFilter, list = filteredCows();
  const pens = [...new Set(S.cows.map(c => c.pen).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ko', { numeric: true }));
  return `<h1>소 목록</h1><p class="sub"><span id="cowCount">${list.length}</span>마리 표시 · 전체 사육 ${active().length}마리</p>
  <div class="card">
    <input type="search" id="cowQ" placeholder="귀표번호 끝자리, 이름으로 찾기" value="${esc(f.q)}" inputmode="search">
    <div class="chips" style="margin-top:10px">${['전체', ...GROUPS].map(g => `<button class="chip ${f.group === g ? 'on' : ''}" data-act="fgroup" data-v="${g}">${g}</button>`).join('')}</div>
    <div class="row">
      <select id="fPen" class="grow"><option value="">모든 칸</option>${pens.map(p => `<option ${f.pen === p ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select>
      <select id="fStatus" class="grow">${[['사육', '사육 중'], ['나감', '출하·판매·폐사'], ['전체', '전체']].map(([v, l]) => `<option value="${v}" ${f.status === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
    </div>
  </div>
  <div class="grid2" style="margin-bottom:14px"><button class="btn" data-act="newCow">＋ 소 등록</button><a class="btn ghost" href="#/bulk">✅ 여러 마리 기록</a></div>
  <div class="card" id="cowBox">${cowListHtml(list)}</div>`;
}

async function editCow(c) {
  const isNew = !c;
  c = c || { group: '번식우', sex: '암', status: '사육' };
  const v = await form(isNew ? '소 등록' : '소 정보 수정', [
    { k: 'tag', label: '귀표번호 (이력번호 12자리)', type: 'text', value: c.tag, inputmode: 'numeric', required: true, ph: '예: 002123456789' },
    { k: 'name', label: '이름 / 별명 (선택)', type: 'text', value: c.name },
    { k: 'sex', label: '성별', type: 'chips', options: SEXES, value: c.sex },
    { k: 'group', label: '구분', type: 'chips', options: GROUPS, value: c.group },
    { k: 'birth', label: '생년월일', type: 'date', value: c.birth },
    { k: 'pen', label: '우사 칸 (예: A-3, 2동 5칸)', type: 'text', value: c.pen, list: [...new Set(S.cows.map(x => x.pen).filter(Boolean))] },
    { k: 'mother', label: '어미 귀표번호 (선택)', type: 'text', value: c.mother, inputmode: 'numeric' },
    { k: 'shipMonths', label: `출하 목표 월령 (비우면 기본 ${S.kv.shipMonths}개월)`, type: 'number', value: c.shipMonths },

function shrink(file, max = 720) {
  return new Promise((res, rej) => {
    const img = new Image(); img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height)), cv = document.createElement('canvas');
      cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(img.src);
      cv.toBlob(b => b ? res(b) : rej(new Error('사진 변환 실패')), 'image/jpeg', .78);
    }; img.onerror = () => rej(new Error('사진을 읽지 못했어요')); img.src = URL.createObjectURL(file);
  });
}

/* ================= 2. 번식 캘린더 ================= */
function breeding(c) {
  if (!isBreeder(c) || (c.status || '사육') !== '사육') return null;
  const K = S.kv, t = today(), ev = eventsOf(c.id);
  let lastCalving = null, lastHeat = null, lastAI = null, check = null, aiCount = 0;
  for (const e of ev) {
    if (e.type === '분만') { lastCalving = e.date; lastAI = null; check = null; lastHeat = null; aiCount = 0; }
    else if (e.type === '수정') { lastAI = e.date; check = null; lastHeat = e.date; aiCount++; }
    else if (e.type === '발정') { lastHeat = e.date; if (!lastAI) check = null; if (lastAI && diff(lastAI, e.date) >= 5) { lastAI = null; check = null; } }
    else if (e.type === '임신감정' && lastAI) { check = e.result; if (check === '공태') lastAI = null; }
  }
  const r = { tasks: [], label: '', cls: '', info: '' };
  if (lastAI) {
    const due = addDays(lastAI, K.gest);
    r.due = due;
    if (check === '임신') { r.label = `임신 · ${fmtD(due)} 분만`; r.cls = 'p'; r.pregnant = true; }
    else { r.label = `수정 ${diff(lastAI, t)}일째`; r.cls = 'y'; }
    if (!check) {
      const re = addDays(lastAI, K.cycle);
      if (diff(t, re) >= -3) r.tasks.push({ date: re, type: '재발정 확인', hint: `${fmtD(lastAI)} 수정 후 ${K.cycle}일` });
      r.tasks.push({ date: addDays(lastAI, K.checkDays), type: '임신감정', hint: `${fmtD(lastAI)} 수정 후 ${K.checkDays}일` });
    }
    r.tasks.push({ date: due, type: '분만예정', hint: `${fmtD(lastAI)} 수정` });
    r.info = `수정일 ${lastAI}${aiCount > 1 ? ` · 이번 산차 ${aiCount}번째 수정` : ''}`;
  } else if (lastHeat) {
    let n = lastHeat; while (diff(t, n) < -2) n = addDays(n, K.cycle);
    r.label = check === '공태' ? '공태(재수정 필요)' : '발정 관찰'; r.cls = check === '공태' ? 'r' : '';
    r.tasks.push({ date: n, type: '발정예정', hint: `마지막 발정·수정 ${fmtD(lastHeat)}` });
    r.info = `발정 주기 ${K.cycle}일로 계산한 예상일이에요.`;
  } else if (lastCalving) {
    const d = diff(lastCalving, t);
    r.label = `분만 후 ${d}일`; r.cls = d >= K.postCalving ? 'y' : '';
    r.tasks.push({ date: addDays(lastCalving, K.postCalving), type: '수정 시작', hint: `${fmtD(lastCalving)} 분만 후 ${K.postCalving}일` });
  } else { r.label = '기록 없음'; }
  return r;
}

/* ================= 3. 방역·접종 ================= */
const VAX = { '구제역': 6, '럼피스킨': 12, '유행열': 12, '아카바네': 12, '설사병': 12, '호흡기': 12 };
const DEWORM_MONTHS = 6;
function nextDose(type, name, date) {
  if (type === '구충') return addMonths(date, DEWORM_MONTHS);
  return VAX[name] ? addMonths(date, VAX[name]) : '';
}
function healthTasks(c) {
  const last = {};
  for (const e of eventsOf(c.id)) if (e.type === '접종' || e.type === '구충') last[e.type + ':' + (e.type === '구충' ? '' : e.name)] = e;
  return Object.values(last).filter(e => e.next).map(e => ({ date: e.next, type: e.type === '구충' ? '구충' : `${e.name} 접종`, hint: `지난번 ${fmtD(e.date)}` }));
}

/* 홈: 할 일 모음 */
function allTasks() {
  const out = [], t = today();
  for (const c of active()) {
    const b = breeding(c);
    const list = [...(b ? b.tasks : []), ...healthTasks(c)];
    if (c.group === '비육우' && c.birth) list.push({ date: addMonths(c.birth, c.shipMonths || S.kv.shipMonths), type: '출하 목표', hint: `${c.shipMonths || S.kv.shipMonths}개월령` });
    for (const x of list) {
      const d = diff(t, x.date);
      const ahead = x.type === '분만예정' || x.type === '출하 목표' ? 21 : 14;
      if (d >= -60 && d <= ahead) out.push({ ...x, cow: c, d });
    }
  }
  return out.sort((a, b) => a.date.localeCompare(b.date));
}

const thi = (T, RH) => (1.8 * T + 32) - (0.55 - 0.0055 * RH) * (1.8 * T - 26);
const LEVELS = [
  { max: 72, name: '정상', tip: '평소대로 관리하세요.' },
  { max: 79, name: '주의', tip: '물을 충분히 주고 환기팬을 켜세요.' },

  { max: 999, name: '매우 위험', tip: '폐사 위험이 큽니다. 모든 냉방 수단을 쓰고, 이상이 보이면 바로 수의사를 부르세요.' },
];
const level = v => LEVELS.findIndex(l => v < l.max);
async function fetchHeat(force) {
  const K = S.kv; if (K.lat == null) return null;
  if (!force && S.heat && Date.now() - S.heat.at < 2 * 3600e3 && S.heat.lat === K.lat && S.heat.lon === K.lon) return S.heat;
  const u = `https://api.open-meteo.com/v1/forecast?latitude=${K.lat}&longitude=${K.lon}&hourly=temperature_2m,relative_humidity_2m&current=temperature_2m,relative_humidity_2m&timezone=Asia%2FSeoul&forecast_days=3`;
  const r = await fetch(u); if (!r.ok) throw new Error('날씨를 불러오지 못했어요 (' + r.status + ')');
  const j = await r.json();
  const hours = j.hourly.time.map((tm, i) => ({ tm, T: j.hourly.temperature_2m[i], RH: j.hourly.relative_humidity_2m[i] })).map(h => ({ ...h, v: thi(h.T, h.RH) }));
  S.heat = { at: Date.now(), lat: K.lat, lon: K.lon, cur: { T: j.current.temperature_2m, RH: j.current.relative_humidity_2m, v: thi(j.current.temperature_2m, j.current.relative_humidity_2m) }, hours };
  await setKV('heatCache', S.heat); return S.heat;
}
function heatBanner() {

const blobToData = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
async function makeBackup() {
  const photos = await DB.all('photos');
  const data = { app: 'hanwoo', ver: 1, at: new Date().toISOString(), cows: S.cows, events: S.events, ledger: S.ledger, kv: Object.fromEntries(Object.entries(S.kv).filter(([k]) => k !== 'heatCache')), photos: await Promise.all(photos.map(async p => ({ id: p.id, data: await blobToData(p.blob) }))) };
  const name = `한우수첩-백업-${today()}.json`, text = JSON.stringify(data);
  const file = new File([text], name, { type: 'application/json' });
  let shared = false;
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); shared = true; } catch (e) { if (e.name === 'AbortError') return; }
  }
  if (!shared) download(name, text, 'application/json');
  await setKV('lastBackup', new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString());
  toast(`백업 완료 (소 ${S.cows.length}, 기록 ${S.events.length}건)`); render();
}
async function restore(file) {
  let d; try { d = JSON.parse(await file.text()); } catch { alert('백업 파일을 읽지 못했어요.'); return; }
  if (d.app !== 'hanwoo') { alert('한우 수첩 백업 파일이 아니에요.'); return; }
  if (!confirm(`백업(${(d.at || '').slice(0, 10)}, 소 ${d.cows.length}마리, 기록 ${d.events.length}건)으로 되살릴까요?\n지금 폰에 있는 데이터는 모두 바뀝니다.`)) return;
  for (const s of STORES) await DB.clear(s);
  await DB.putMany('cows', d.cows); await DB.putMany('events', d.events); await DB.putMany('ledger', d.ledger || []);
  await DB.putMany('kv', Object.entries(d.kv || {}).map(([k, v]) => ({ k, v })));
  const photos = await Promise.all((d.photos || []).map(async p => ({ id: p.id, blob: await (await fetch(p.data)).blob() })));

/* ================= 공용 입력 시트 ================= */
function form(title, fields, opt = {}) {
  return new Promise(resolve => {
    const bg = document.createElement('div'); bg.className = 'sheet-bg';
    const fid = 'f' + uid();
    bg.innerHTML = `<form class="sheet" id="${fid}" novalidate><h2>${esc(title)}</h2>${fields.map(f => {
      const v = f.value ?? '';
      if (f.type === 'chips') return `<div class="field" style="margin-top:12px"><div class="muted small" style="margin-bottom:6px">${esc(f.label)}</div><div class="chips" data-chips="${f.k}">${f.options.map(o => `<button type="button" class="chip ${o === v ? 'on' : ''}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}${f.other ? `<button type="button" class="chip ${v && !f.options.includes(v) ? 'on' : ''}" data-v="__other">기타</button>` : ''}</div>${f.other ? `<input type="text" data-other="${f.k}" placeholder="직접 입력" class="${v && !f.options.includes(v) ? '' : 'hidden'}" value="${f.options.includes(v) ? '' : esc(v)}">` : ''}</div>`;
      if (f.type === 'check') return `<label class="check"><input type="checkbox" name="${f.k}" ${v ? 'checked' : ''}>${esc(f.label)}</label>`;
      if (f.type === 'textarea') return `<label class="field"><span>${esc(f.label)}</span><textarea name="${f.k}">${esc(v)}</textarea></label>`;
      const lid = f.list ? 'dl' + uid() : '';
      return `<label class="field"><span>${esc(f.label)}</span><input type="${f.type}" name="${f.k}" value="${esc(v)}" ${f.inputmode ? `inputmode="${f.inputmode}"` : f.type === 'number' ? 'inputmode="decimal"' : ''} ${f.ph ? `placeholder="${esc(f.ph)}"` : ''} ${lid ? `list="${lid}"` : ''} autocomplete="off">${lid ? `<datalist id="${lid}">${f.list.map(o => `<option value="${esc(o)}">`).join('')}</datalist>` : ''}</label>`;
    }).join('')}
    ${opt.del ? '<button type="button" class="btn ghost block" data-del style="margin-top:18px;color:var(--danger)">🗑 삭제</button>' : ''}
    <div class="foot"><button type="button" class="btn ghost" data-cancel>취소</button><button type="submit" class="btn">${esc(opt.saveText || '저장')}</button></div></form>`;
    document.body.appendChild(bg);
    const fm = bg.querySelector('form'), close = r => { bg.remove(); resolve(r); };
    bg.addEventListener('click', e => {
      if (e.target === bg || e.target.closest('[data-cancel]')) return close(null);
      if (e.target.closest('[data-del]')) return close('DELETE');
      const ch = e.target.closest('[data-chips] .chip');
      if (ch) {
        const box = ch.parentElement, k = box.dataset.chips, on = ch.classList.contains('on');
        box.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
        const fdef = fields.find(f => f.k === k);
        if (!(on && fdef.value === '')) ch.classList.add('on'); // 값이 비어도 되는 칩(등급 등)은 다시 누르면 해제
        const oth = fm.querySelector(`[data-other="${k}"]`); if (oth) { oth.classList.toggle('hidden', ch.dataset.v !== '__other' || !ch.classList.contains('on')); if (!oth.classList.contains('hidden')) oth.focus(); }
      }
    });
    fm.addEventListener('submit', e => {
      e.preventDefault(); const out = {};
      for (const f of fields) {
        if (f.type === 'chips') { const on = fm.querySelector(`[data-chips="${f.k}"] .chip.on`); out[f.k] = on ? (on.dataset.v === '__other' ? fm.querySelector(`[data-other="${f.k}"]`).value.trim() : on.dataset.v) : ''; }
        else if (f.type === 'check') out[f.k] = fm.elements[f.k].checked;
        else out[f.k] = fm.elements[f.k].value.trim();
        if (f.required && !out[f.k]) { alert(`‘${f.label}’을(를) 입력해 주세요.`); return; }
      }
      close(out);
    });
    const first = fm.querySelector('input[type=text],input[type=number]'); if (first && !first.value) setTimeout(() => first.focus(), 50);
  });
}

  if (t.id === 'wG' || t.id === 'wL') {
    const g = +$('#wG').value, l = +$('#wL').value;
    if (g > 50 && l > 50) { const w = estWeight(g, l); $('#wOut').textContent = `${w} kg`; $('#wRange').textContent = `대략 ${Math.round(w * .9)} ~ ${Math.round(w * 1.1)} kg`; }
    else { $('#wOut').textContent = '- kg'; $('#wRange').textContent = ''; }
  }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'fPen') { cowFilter.pen = t.value; render(); }
  if (t.id === 'fStatus') { cowFilter.status = t.value; render(); }
  if (t.id === 'bPen') { bulk.pen = t.value; render(); }
  if (t.dataset.bsel) {
    t.checked ? bulk.sel.add(t.dataset.bsel) : bulk.sel.delete(t.dataset.bsel);
    const n = bulk.visible.filter(id => bulk.sel.has(id)).length;
    $('#bCount').textContent = `${n}마리 선택`; const b = $('#bGoBtn'); b.disabled = !n; b.textContent = `3. ${n}마리에 ${bulk.type} 기록하기 →`;
  }
  if (t.dataset.kv) { const k = t.dataset.kv, v = t.type === 'number' ? +t.value : t.value; if (t.type === 'number' && !(v > 0)) return toast('0보다 큰 숫자를 넣어 주세요'); await setKV(k, v); toast('저장했어요'); }
  if (t.id === 'photoIn' && t.files[0]) {
    try { const blob = await shrink(t.files[0]); await DB.put('photos', { id: t.dataset.id, blob }); if (photoUrls[t.dataset.id]) URL.revokeObjectURL(photoUrls[t.dataset.id]); delete photoUrls[t.dataset.id]; toast('사진을 저장했어요'); render(); }
    catch (err) { alert(err.message); }
  }
  if (t.id === 'restoreIn' && t.files[0]) restore(t.files[0]);
});

/* ================= 시작 ================= */
(async () => {
  try { await DB.open(); await loadAll(); }
  catch (err) { $('#app').innerHTML = `<div class="msg err">저장소를 열지 못했어요: ${esc(err.message)}<br>시크릿 모드라면 일반 창에서 열어 주세요.</div>`; return; }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  render();
  if (S.kv.lat != null && navigator.onLine) fetchHeat().then(() => { if ((location.hash || '#/') === '#/' || location.hash === '#/heat') render(); }, () => {});
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
